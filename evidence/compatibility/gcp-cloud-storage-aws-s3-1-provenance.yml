quote: The Cloud Storage XML API is interoperable with some tools and libraries that work with services such as
  Amazon Simple Storage Service (Amazon S3). To use these tools and libraries with Cloud Storage, change the request
  endpoint that the tool or library uses to the Cloud Storage URI https://storage.
