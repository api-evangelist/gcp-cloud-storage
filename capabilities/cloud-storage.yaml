naftiko: 1.0.0-alpha2
info:
  label: Google Cloud Storage Management
  description: Unified workflow for managing cloud storage buckets, objects, access controls, and IAM policies. Used by cloud
    engineers and data platform teams.
  tags:
  - Google Cloud
  - Cloud Storage
  - Object Storage
  - Data Management
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    GCP_OAUTH2_TOKEN: GCP_OAUTH2_TOKEN
capability:
  consumes:
  - type: http
    namespace: cloud-storage
    baseUri: https://storage.googleapis.com/storage/v1
    description: Google Cloud Storage JSON API for bucket and object management.
    authentication:
      type: bearer
      token: '{{GCP_OAUTH2_TOKEN}}'
    resources:
    - name: buckets
      path: /b
      description: Bucket management.
      operations:
      - name: list-buckets
        method: GET
        description: List buckets for a project.
        inputParameters:
        - name: project
          in: query
          type: string
          required: true
          description: Project ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-bucket
        method: POST
        description: Create a new bucket.
        inputParameters:
        - name: project
          in: query
          type: string
          required: true
          description: Project ID.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
    - name: bucket-details
      path: /b/{bucket}
      description: Individual bucket management.
      operations:
      - name: get-bucket
        method: GET
        description: Get bucket metadata.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-bucket
        method: PUT
        description: Update bucket metadata.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
      - name: delete-bucket
        method: DELETE
        description: Delete a bucket.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: bucket-iam
      path: /b/{bucket}/iam
      description: Bucket IAM policy management.
      operations:
      - name: get-bucket-iam-policy
        method: GET
        description: Get bucket IAM policy.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: set-bucket-iam-policy
        method: PUT
        description: Set bucket IAM policy.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            bindings: '{{tools.bindings}}'
    - name: objects
      path: /b/{bucket}/o
      description: Object management.
      operations:
      - name: list-objects
        method: GET
        description: List objects in a bucket.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: object-details
      path: /b/{bucket}/o/{object}
      description: Individual object management.
      operations:
      - name: get-object
        method: GET
        description: Get object metadata.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        - name: object
          in: path
          type: string
          required: true
          description: Object name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-object
        method: PUT
        description: Update object metadata.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        - name: object
          in: path
          type: string
          required: true
          description: Object name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            metadata: '{{tools.metadata}}'
      - name: delete-object
        method: DELETE
        description: Delete an object.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Bucket name.
        - name: object
          in: path
          type: string
          required: true
          description: Object name.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: object-copy
      path: /b/{bucket}/o/{object}/copyTo/b/{destinationBucket}/o/{destinationObject}
      description: Object copy operations.
      operations:
      - name: copy-object
        method: POST
        description: Copy an object to another location.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Source bucket.
        - name: object
          in: path
          type: string
          required: true
          description: Source object.
        - name: destinationBucket
          in: path
          type: string
          required: true
          description: Destination bucket.
        - name: destinationObject
          in: path
          type: string
          required: true
          description: Destination object.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: object-compose
      path: /b/{bucket}/o/{object}/compose
      description: Object composition.
      operations:
      - name: compose-objects
        method: POST
        description: Compose multiple objects into one.
        inputParameters:
        - name: bucket
          in: path
          type: string
          required: true
          description: Destination bucket.
        - name: object
          in: path
          type: string
          required: true
          description: Destination object.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            sourceObjects: '{{tools.sourceObjects}}'
  exposes:
  - type: rest
    port: 8080
    namespace: cloud-storage-api
    description: Unified REST API for Google Cloud Storage management.
    resources:
    - path: /v1/buckets
      name: buckets
      description: Bucket management.
      operations:
      - method: GET
        name: list-buckets
        description: List buckets.
        call: cloud-storage.list-buckets
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-bucket
        description: Create a bucket.
        call: cloud-storage.create-bucket
        with:
          project: rest.project
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buckets/{id}
      name: bucket-details
      description: Individual bucket management.
      operations:
      - method: GET
        name: get-bucket
        description: Get bucket details.
        call: cloud-storage.get-bucket
        with:
          bucket: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-bucket
        description: Update a bucket.
        call: cloud-storage.update-bucket
        with:
          bucket: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-bucket
        description: Delete a bucket.
        call: cloud-storage.delete-bucket
        with:
          bucket: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buckets/{id}/iam
      name: bucket-iam
      description: Bucket IAM management.
      operations:
      - method: GET
        name: get-bucket-iam-policy
        description: Get IAM policy.
        call: cloud-storage.get-bucket-iam-policy
        with:
          bucket: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: set-bucket-iam-policy
        description: Set IAM policy.
        call: cloud-storage.set-bucket-iam-policy
        with:
          bucket: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buckets/{bucketId}/objects
      name: objects
      description: Object management.
      operations:
      - method: GET
        name: list-objects
        description: List objects.
        call: cloud-storage.list-objects
        with:
          bucket: rest.bucketId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/buckets/{bucketId}/objects/{objectId}
      name: object-details
      description: Individual object management.
      operations:
      - method: GET
        name: get-object
        description: Get object metadata.
        call: cloud-storage.get-object
        with:
          bucket: rest.bucketId
          object: rest.objectId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-object
        description: Update object metadata.
        call: cloud-storage.update-object
        with:
          bucket: rest.bucketId
          object: rest.objectId
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-object
        description: Delete an object.
        call: cloud-storage.delete-object
        with:
          bucket: rest.bucketId
          object: rest.objectId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: cloud-storage-mcp
    transport: http
    description: MCP server for AI-assisted cloud storage management.
    tools:
    - name: list-buckets
      description: List storage buckets in a project.
      hints:
        readOnly: true
        openWorld: true
      call: cloud-storage.list-buckets
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bucket
      description: Get bucket details.
      hints:
        readOnly: true
      call: cloud-storage.get-bucket
      with:
        bucket: tools.bucket
      outputParameters:
      - type: object
        mapping: $.
    - name: create-bucket
      description: Create a new storage bucket.
      hints:
        readOnly: false
      call: cloud-storage.create-bucket
      with:
        project: tools.project
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-bucket
      description: Delete a storage bucket.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-storage.delete-bucket
      with:
        bucket: tools.bucket
      outputParameters:
      - type: object
        mapping: $.
    - name: list-objects
      description: List objects in a bucket.
      hints:
        readOnly: true
        openWorld: true
      call: cloud-storage.list-objects
      with:
        bucket: tools.bucket
      outputParameters:
      - type: object
        mapping: $.
    - name: get-object
      description: Get object metadata.
      hints:
        readOnly: true
      call: cloud-storage.get-object
      with:
        bucket: tools.bucket
        object: tools.object
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-object
      description: Delete an object.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: cloud-storage.delete-object
      with:
        bucket: tools.bucket
        object: tools.object
      outputParameters:
      - type: object
        mapping: $.
    - name: copy-object
      description: Copy an object to another location.
      hints:
        readOnly: false
      call: cloud-storage.copy-object
      with:
        bucket: tools.sourceBucket
        object: tools.sourceObject
        destinationBucket: tools.destinationBucket
        destinationObject: tools.destinationObject
      outputParameters:
      - type: object
        mapping: $.
    - name: compose-objects
      description: Compose multiple objects into one.
      hints:
        readOnly: false
      call: cloud-storage.compose-objects
      with:
        bucket: tools.bucket
        object: tools.destinationObject
      outputParameters:
      - type: object
        mapping: $.
    - name: get-bucket-iam-policy
      description: Get bucket IAM policy.
      hints:
        readOnly: true
      call: cloud-storage.get-bucket-iam-policy
      with:
        bucket: tools.bucket
      outputParameters:
      - type: object
        mapping: $.
    - name: set-bucket-iam-policy
      description: Set bucket IAM policy.
      hints:
        readOnly: false
        idempotent: true
      call: cloud-storage.set-bucket-iam-policy
      with:
        bucket: tools.bucket
      outputParameters:
      - type: object
        mapping: $.
